<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1150" viewBox="0 0 1160 1150">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#666"/></marker></defs>
<rect width="1160" height="1150" fill="#fbfbfa"/>
<text x="580" y="42" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">奶蛙 QQ 数字生命 · 架构与消息流</text>
<text x="580" y="68" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#666" text-anchor="middle">QQ → SnowLuma(Docker) → fish-bot(Node) → DeepSeek Responses API（服务端 web_search）</text>
<rect x="360" y="95" width="400" height="75" rx="12" fill="#e8f0ff" stroke="#b5b5b0" stroke-width="1.5"/><text x="560" y="123" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">QQ（用户 / 群友）</text><text x="560" y="149" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">QQ 小号已登录</text><text x="560" y="170" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">私聊 / 群聊消息</text>
<line x1="560" y1="170" x2="560" y2="215" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="215" width="520" height="120" rx="12" fill="#fff4e5" stroke="#b5b5b0" stroke-width="1.5"/><text x="560" y="243" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">SnowLuma（Docker 容器 · 127.0.0.1）</text><text x="560" y="269" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">Linux QQ + Hook 注入 → OneBot v11</text><text x="560" y="290" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">6081 noVNC 扫码 · 5099 WebUI</text><text x="560" y="311" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">3000 HTTP · 3001 WebSocket</text>
<line x1="560" y1="335" x2="560" y2="380" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="380" width="640" height="195" rx="12" fill="#e8f7ee" stroke="#b5b5b0" stroke-width="1.5"/><text x="560" y="408" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">fish-bot.mjs（Node 常驻进程）</text><text x="560" y="434" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">收消息 → 检索记忆 → 拼 system prompt</text><text x="560" y="455" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">人设 · 社交准则 · 长期记忆 · 当前时间 · 短期历史</text><text x="560" y="476" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">→ DeepSeek → 写记忆 → 经 OneBot 发回 QQ</text>
<line x1="560" y1="575" x2="560" y2="625" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="330" y="625" width="460" height="125" rx="12" fill="#f3e8ff" stroke="#b5b5b0" stroke-width="1.5"/><text x="560" y="653" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">DeepSeek Responses API</text><text x="560" y="679" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">POST /v1/responses · model: deepseek-v4-pro</text><text x="560" y="700" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">tools: [{ type: "web_search" }]（服务端自动搜）</text>
<text x="568" y="360" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="12" font-weight="normal" fill="#888" text-anchor="start">OneBot v11 事件</text>
<text x="568" y="605" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="12" font-weight="normal" fill="#888" text-anchor="start">HTTP （Responses）</text>
<rect x="30" y="410" width="180" height="135" rx="12" fill="#f3f4f6" stroke="#b5b5b0" stroke-width="1.5"/><text x="120" y="438" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">存储（data/naiwa）</text><text x="120" y="464" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">memory.json</text><text x="120" y="485" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">character.json</text><text x="120" y="506" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">events.json</text>
<line x1="210" y1="477" x2="240" y2="477" stroke="#666" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="900" y="410" width="200" height="165" rx="12" fill="#fdf2f8" stroke="#b5b5b0" stroke-width="1.5"/><text x="1000" y="438" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">system prompt</text><text x="1000" y="464" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">persona/naiwa.md</text><text x="1000" y="485" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">social-rules.md</text><text x="1000" y="506" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">长期记忆</text><text x="1000" y="527" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">当前时间</text><text x="1000" y="548" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="13" font-weight="normal" fill="#444" text-anchor="middle">短期历史 6 条</text>
<line x1="900" y1="492" x2="880" y2="492" stroke="#666" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<path d="M 790 685 L 1120 685 L 1120 130 L 760 130" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="1108" y="400" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="12" font-weight="normal" fill="#888" text-anchor="end">回复</text>
<text x="40" y="1080" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="12" font-weight="normal" fill="#888" text-anchor="start">实线 = 请求流向</text>
<text x="40" y="1100" font-family="PingFang SC, Microsoft YaHei, 'Noto Sans SC', sans-serif" font-size="12" font-weight="normal" fill="#888" text-anchor="start">虚线 = 存储 / prompt 注入 / 回复</text>
